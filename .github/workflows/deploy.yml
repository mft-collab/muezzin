name: Deploy to Firebase

# CI Test Suite'in tamamlanmasını bekler ve YALNIZCA main'e yapılan push
# testlerden geçtiyse deploy eder. Bu, firestore.rules gibi güvenlik açısından
# kritik dosyaların test edilmeden production'a çıkmasını engeller.
on:
  workflow_run:
    workflows: ["CI Test Suite"]
    types: [completed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          # Vite VITE_* değişkenlerini build zamanında gömer; secret GitHub
          # repo ayarlarında tanımlı değilse push bildirimleri sessizce
          # devre dışı kalır (bkz. src/hooks/useFcmToken.ts).
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
      - name: Deploy to Firebase (hosting + firestore rules + indexes)
        uses: w9jds/firebase-action@v15.23.0
        with:
          args: deploy --only hosting,firestore:rules,firestore:indexes
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
          PROJECT_ID: muezzin-c8485
      # Diğer 6 otomasyon workflow'unun (bkz. haftalik-plan.yml vb.) hepsi
      # bu deseni izler — deploy başarısız olursa (auth/kota/rules reddi)
      # CI yeşil görünüp production yine de güncellenmemiş olabilir; bu
      # ADMIN PANELİNDE görünür olmalı, GitHub Actions sekmesini elle
      # kontrol etmeye bağlı kalınmamalı (bkz. kod denetimi).
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Firebase Deploy"
