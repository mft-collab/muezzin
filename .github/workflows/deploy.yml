name: Deploy to Firebase

# CI Test Suite'in tamamlanmasını bekler ve YALNIZCA main'e yapılan push
# testlerden geçtiyse deploy eder. Bu, firestore.rules gibi güvenlik açısından
# kritik dosyaların test edilmeden production'a çıkmasını engeller.
on:
  workflow_run:
    workflows: ["CI Test Suite"]
    types: [completed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          # Vite VITE_* değişkenlerini build zamanında gömer; secret GitHub
          # repo ayarlarında tanımlı değilse push bildirimleri sessizce
          # devre dışı kalır (bkz. src/hooks/useFcmToken.ts).
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
      # `firebase deploy --only firestore:indexes` TAM SENKRON çalışır: canlıda
      # var ama firestore.indexes.json'da olmayan bir composite index'i
      # SESSİZCE SİLER. Biri Firebase konsolundan elle bir index eklerse (ör.
      # bir arıza anında hızlı çözüm için) ve bunu repo'ya commit etmeyi
      # unutursa, bir sonraki deploy onu hiçbir uyarı vermeden geri alır
      # (bkz. deploy.yml denetimi). Deploy'dan ÖNCE canlıyı indirip
      # firestore.indexes.json ile karşılaştırarak bu sessiz silinmeyi
      # görünür bir hataya çeviriyoruz.
      - name: Canlıdaki Firestore composite index'lerini indir
        timeout-minutes: 3
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
          # Bu adım Firebase API'sine yeni bir ağ bağımlılığı ekliyor — geçici
          # bir blip/rate-limit YÜZÜNDEN kodla ilgisi olmayan bir deploy
          # başarısızlığı yaşanmasın diye 3 deneme + artan bekleme (bkz. kod
          # denetimi). Gerçek drift tespiti (aşağıdaki ayrı adım) deterministik
          # olduğundan hiç yeniden denenmiyor — yalnızca bu ağ çağrısı deneniyor.
          basarili=0
          for deneme in 1 2 3; do
            if npx firebase-tools firestore:indexes --project muezzin-c8485 > live-firestore-indexes.json; then
              basarili=1
              break
            fi
            echo "Canlı index listesi alınamadı (deneme $deneme/3)." >&2
            [ "$deneme" != "3" ] && sleep $((deneme * 5))
          done
          rm -f /tmp/gcp-key.json
          [ "$basarili" = "1" ] || { echo "3 denemede de canlı index listesi alınamadı, deploy durduruluyor." >&2; exit 1; }
      - name: Repo'da tanımlı olmayan (elle eklenmiş) index var mı kontrol et
        run: npx tsx scripts/verify-no-index-drift.ts live-firestore-indexes.json
      - name: Deploy to Firebase (hosting + firestore rules + indexes + rtdb rules)
        uses: w9jds/firebase-action@v15.23.0
        with:
          # `database` (Realtime Database kuralları) eklendi — src/lib/timeSync.ts
          # RTDB'yi `.info/serverTimeOffset` için kullanıyor ama proje şimdiye
          # kadar RTDB kurallarını hiç deploy etmiyordu; canlıdaki kurallar
          # bu repo'nun görünürlüğü/denetimi dışında, elle ne ayarlandıysa
          # oydu (bkz. kod denetimi). database.rules.json artık `.read`/`.write`'ı
          # tamamen kapatıyor — `.info/*` yolları rule'lardan BAĞIMSIZ her zaman
          # okunabilir olduğundan initTimeSync() bundan etkilenmez.
          args: deploy --only hosting,firestore:rules,firestore:indexes,database
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
          PROJECT_ID: muezzin-c8485
      # Diğer 6 otomasyon workflow'unun (bkz. haftalik-plan.yml vb.) hepsi
      # bu deseni izler — deploy başarısız olursa (auth/kota/rules reddi)
      # CI yeşil görünüp production yine de güncellenmemiş olabilir; bu
      # ADMIN PANELİNDE görünür olmalı, GitHub Actions sekmesini elle
      # kontrol etmeye bağlı kalınmamalı (bkz. kod denetimi).
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Firebase Deploy"
