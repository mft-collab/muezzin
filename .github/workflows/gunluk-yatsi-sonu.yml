name: Günlük Yatsı Sonu İşlemleri

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

jobs:
  yatsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Paketleri kur
        run: npm ci

      - name: Yatsı sonrası işlemleri çalıştır
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          # Secret'ın dolu olup olmadığını kontrol et
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "HATA: GOOGLE_APPLICATION_CREDENTIALS_JSON secret'ı boş veya tanımlanmamış!"
            exit 1
          fi

          # JSON dosyasını oluştur
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > credentials.json
          
          # Dosyanın fiziksel varlığını doğrula
          ls -l credentials.json
          
          export GOOGLE_APPLICATION_CREDENTIALS=credentials.json
          npx tsx scripts/yatsiSonuIslemleri.ts
