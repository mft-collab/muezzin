- name: Yatsı sonrası işlemleri çalıştır
        env:
          # Secret isminin GitHub'dakiyle birebir aynı olduğundan emin ol
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          # 1. Secret'ın doluluğunu kontrol et (İçeriği sızdırmaz, sadece karakter sayısını yazar)
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "HATA: GOOGLE_APPLICATION_CREDENTIALS_JSON secret'ı boş!"
            exit 1
          fi
          echo "Secret doğrulandı, uzunluk: ${#SERVICE_ACCOUNT} karakter."

          # 2. JSON'u güvenli bir şekilde dosyaya yaz (Heredoc yöntemi)
          cat <<EOF > credentials.json
          $SERVICE_ACCOUNT
          EOF
          
          # 3. Ortam değişkenini tanımla ve script'i çalıştır
          export GOOGLE_APPLICATION_CREDENTIALS=credentials.json
          npx tsx scripts/yatsiSonuIslemleri.ts
