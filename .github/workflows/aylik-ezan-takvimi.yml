name: Aylık Ezan Takvimi Güncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 28 * *'

jobs:
  takvim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paketleri kur
        run: npm ci
      - name: Takvimi güncelle
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 || secrets.FIREBASE_SERVICE_ACCOUNT_KEY || secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: npx tsx scripts/aylikEzanTakvimiGuncelle.ts
