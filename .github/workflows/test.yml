name: CI Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # firebase-tools artık Auth emülatörü için JDK 21+ istiyor.
          java-version: '21'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Run rules & smoke tests
        run: npm run test:all

      - name: Run Playwright E2E tests (against Firestore + Auth emulators)
        run: firebase emulators:exec --only firestore,auth --project muezzin-c8485 "npx playwright test"
