name: CI Test Suite

# `build_and_deploy` job'ı `test` job'ına `needs:` ile bağlı ve YALNIZCA
# main'e push testlerden geçtiyse deploy eder. Bu, firestore.rules gibi
# güvenlik açısından kritik dosyaların test edilmeden production'a
# çıkmasını engeller. Önceden ayrı bir deploy.yml, workflow_run ile bu
# workflow'un `name:` alanına göre (dosya adına değil) eşleşiyordu — bu isim
# değiştirilirse deploy zinciri sessizce kopardı. Aynı workflow içinde
# job-to-job `needs:` bağımlılığı bu kırılganlığı ortadan kaldırır.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # firebase-tools artık Auth emülatörü için JDK 21+ istiyor.
          java-version: '21'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Run rules & smoke tests
        run: npm run test:all

      - name: Run Playwright E2E tests (against Firestore + Auth emulators)
        run: firebase emulators:exec --only firestore,auth --project muezzin-c8485 "npx playwright test"

      # E2E başarısız olduğunda trace.zip/error-context.md indirilemiyordu —
      # kök nedeni yalnızca CI loglarındaki metinden tahmin etmek gerekiyordu
      # (bkz. mazeret-flow.spec.ts flakiness soruşturması). Yalnızca hata
      # durumunda yükleniyor, her yeşil koşuda gereksiz depolama harcamıyor.
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build_and_deploy:
    name: Build & Deploy to Firebase
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          # Vite VITE_* değişkenlerini build zamanında gömer; secret GitHub
          # repo ayarlarında tanımlı değilse push bildirimleri sessizce
          # devre dışı kalır (bkz. src/hooks/useFcmToken.ts).
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
      # vite.config.ts'te sourcemap:'hidden' — .map dosyaları dist/'te üretilir
      # ama firebase.json'un hosting.ignore'u nedeniyle deploy'a dahil edilmez
      # (public'e sızmaz). Prod'daki bir hatanın minified stack trace'ini
      # ayıklayabilmek için bu artifact'i indirip yerel source-map araçlarıyla
      # eşlemek gerekir (bkz. premium denetim, bölüm 7).
      - name: Upload source maps (debug artifact, not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ github.sha }}
          path: dist/**/*.map
          retention-days: 90
      - name: Deploy to Firebase (hosting + firestore rules + indexes)
        uses: w9jds/firebase-action@v15.23.0
        with:
          args: deploy --only hosting,firestore:rules,firestore:indexes
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
          PROJECT_ID: muezzin-c8485
