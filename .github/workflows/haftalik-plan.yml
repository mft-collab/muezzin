name: Haftalik Plan Olustur

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 0'

jobs:
  planla:
    runs-on: ubuntu-latest
    env:
      # Actions uyarılarını susturmak için ortam değişkeni
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paketleri kur
        run: npm ci
      - name: Planı oluştur
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > credentials.json
          # GITHUB_WORKSPACE ile mutlak yol belirlemek daha güvenlidir
          export GOOGLE_APPLICATION_CREDENTIALS="${GITHUB_WORKSPACE}/credentials.json"
          npx tsx scripts/haftalikPlanOlustur.ts
