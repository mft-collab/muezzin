name: Haftalik Plan Olustur

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 0'

jobs:
  planla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paketleri kur
        run: npm install
      - name: Planı oluştur
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: npx tsx scripts/haftalikPlanOlustur.ts
