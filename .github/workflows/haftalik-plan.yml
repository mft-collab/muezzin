name: Haftalik Plan Olustur

on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * 0'

jobs:
  planla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Planı oluştur
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/haftalikPlanOlustur.ts
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Haftalık Plan Oluştur"
