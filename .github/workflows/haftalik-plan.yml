name: Haftalik Plan Olustur

on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * 0'

jobs:
  planla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Planı oluştur
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/haftalikPlanOlustur.ts
