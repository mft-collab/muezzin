name: Haftalik Plan Olustur

on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * 0'

# Zamanlanmış çalıştırma ile elle tetiklenen (workflow_dispatch) bir çalıştırma
# çakışırsa, script'in `haftaPlanlari/{haftaId}` için exists-check + batch.commit
# arasında transaction koruması yok — ikinci çalıştırma yayınlanmış planı
# sessizce ezebilir (bkz. kod denetimi). Aynı anda tek çalıştırma garantisi.
concurrency:
  group: haftalik-plan
  cancel-in-progress: false

jobs:
  planla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Planı oluştur
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/haftalikPlanOlustur.ts
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Haftalık Plan Oluştur"
